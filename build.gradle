plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.0'
}

apply from: 'version.gradle'

group = 'com.ratmir.spring'
version = '0.0.1-SNAPSHOT'
description = 'hogwards-artifacts-online'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    implementation 'org.springframework.boot:spring-boot-starter-amqp'
//    testImplementation 'org.springframework.amqp:spring-rabbit-test'
//    testImplementation 'org.testcontainers:rabbitmq'

    implementation "org.mapstruct:mapstruct:${versions.mapstruct}"

    annotationProcessor "org.mapstruct:mapstruct-processor:${versions.mapstruct}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${versions.lombok_mapstruct}"

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.data:spring-data-envers'

    //QueryDSL
    implementation "com.querydsl:querydsl-jpa:${versions.querydsl}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${versions.querydsl}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    testAnnotationProcessor "com.querydsl:querydsl-apt:${versions.querydsl}:jakarta"
    testAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    implementation 'org.springframework.boot:spring-boot-docker-compose'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Нахождение агентного JAR в тестовом classpath (делаем это внутри configureEach)
    def mockitoJar = configurations.testRuntimeClasspath.files.find { it.name.contains('mockito-core') }
    if (mockitoJar) {
        tasks.test.jvmArgs += "-javaagent:${mockitoJar.absolutePath}"
        tasks.test.jvmArgs += "-Xshare:off"
    }
}

bootJar {
    // Spring Boot Gradle plugin уже собирает "fat jar" (bootJar)
    archiveBaseName.set('hogwards-artifacts-online')
}